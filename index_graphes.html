<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petro-Data Analysis App</title>
    <!-- Lien vers le manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content=#121b15>
    <link rel="stylesheet" href="index_graphes.css">
    <script src="xlsx.full.min.js"></script>
    <script src="dexie.js"></script>
    <script src="chart.umd.js"></script>
</head>

<body>
    <header>
        <div style="display: grid;  grid-template-columns: repeat(2, 1fr);">
            <span style="text-align: left;" class="accentuation titre">SOUTIREUSE</span>
            <span style="text-align: right;" class="titre">Tableau <span class="accentuation titre">de</span>
                bord</span>
        </div>

        <div class="header-subtitle" style="display: grid; grid-template-columns: repeat(2, 1fr);">
            <!-- Le point vert clignotant + le texte -->
            <div style="text-align: left; display: flex; align-items: center; gap: 5px;">
                <span class="dot-vert" style="margin-top: 1.5px;"></span>
                <span class="status-text">PET G12 · <a href="index.html" class="lien-page-suivante">ACCUEIL</a> · <a href="Historique.html" class="lien-page-suivante">HISTORIQUE</a></span>
            </div>

            <!-- L'heure dynamique -->
            <div class="horloge" id="horloge-live" style="text-align: right;">00:00:00</div>
        </div>
    </header>

    <div class="barre"></div>

    <main>
        <h2>Diagramme de Pareto - Historique des Alarmes</h2>

        <!-- Conteneur avec hauteur fixée pour limiter la taille du graphique -->
        <div style="position: relative; height:400px; width:100%; min-height: 350px;">
            <canvas id="paretoChart"></canvas>
        </div>
<br>
        <div>
            <h2>Doughnut-Répartition des types de défauts-Types de module</h2>
            <!-- Conteneur fixe pour le Beignet -->
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 15%;">
                <div style=" height: 350px; min-height: 300px;">
                    <canvas id="typeDoughnutChart" style="width: 100%;"></canvas>
                </div>



            <div style="height: 350px;">
                <canvas id="organesDoughnutChart" style="width: 100%;"></canvas>
            </div>
        </div>

        <br>
    <h2>CHRONOLOGIE DES RECURRENCES</h2>
    
    <!-- Conteneur adaptatif du graphique en ligne -->
    <div style="position: relative; width: 100%; height: 380px; min-height: 300px;">
        <canvas id="chronologieChart"></canvas>
    </div>
</div>


       
    </main>
    <br>
    <br>

    <footer>
        <div class="footer">
            <span>Krones-Soutireuse PET G12</span>
            <span>SABC</span>
            <span>sidoctafr@gmail.com</span>
        </div>
    </footer>

    <script src="index.js"></script>
    <script src="index_graphes.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('service_worker.js')
            .then(reg => console.log('PWA Service Worker enregistré avec succès !', reg))
            .catch(err => console.error('Échec enregistrement PWA :', err));
        });
      }
    </script>
</body>

</html>
